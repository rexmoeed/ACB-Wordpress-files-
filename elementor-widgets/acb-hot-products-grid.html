<style>
.acb-products-wrapper {
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
    font-family: 'Titillium Web', sans-serif;
}
.acb-products-heading {
    color: #FF2E2E;
    font-size: 44px;
    font-weight: 700;
    text-align: center;
    text-transform: capitalize;
    line-height: 1.1;
    margin: 0 0 20px;
    letter-spacing: 0.5px;
    font-family: 'Titillium Web', sans-serif;
}
.acb-products-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
}
.acb-product-card {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    border: 2px solid #ffffff;
}
.acb-product-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
}
.acb-product-card:hover img {
    transform: scale(1.08);
}
.acb-product-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 12px 10px 10px;
    background-color: rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
}
.acb-product-title {
    margin: 0;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.2px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    font-family: 'Titillium Web', sans-serif;
}
.acb-quote-btn {
    display: inline-block;
    background-color: #FF2E2E;
    color: #ffffff;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.3px;
    padding: 7px 18px;
    border-radius: 30px;
    text-decoration: none;
    transition: background-color 0.3s ease, transform 0.3s ease;
    font-family: 'Titillium Web', sans-serif;
}
.acb-quote-btn:hover {
    background-color: #FF5757;
    transform: translateY(-3px);
    color: #ffffff;
}

@media (max-width: 991px) {
    .acb-products-grid {
        gap: 14px;
    }
}

@media (max-width: 600px) {
    .acb-products-heading {
        font-size: 32px;
    }
    .acb-products-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }
    .acb-product-overlay {
        padding: 8px;
        gap: 4px;
    }
    .acb-product-title {
        font-size: 12px;
    }
    .acb-quote-btn {
        font-size: 11px;
        padding: 6px 14px;
    }
}
</style>

<div class="acb-products-wrapper">
    <h2 class="acb-products-heading">Hot Products</h2>
    <div class="acb-products-grid">

        <div class="acb-product-card">
            <img src="http://localhost:10004/wp-content/uploads/2026/07/ChatGPT-Image-Jul-21-2026-04_34_25-PM.webp" alt="Custom Chocolate Bar Packaging">
            <div class="acb-product-overlay">
                <h3 class="acb-product-title">Custom Chocolate Bar Packaging</h3>
                <a href="http://localhost:10004/get-quote/" class="acb-quote-btn">Get Quote</a>
            </div>
        </div>

        <div class="acb-product-card">
            <img src="http://localhost:10004/wp-content/uploads/2026/07/ChatGPT-Image-Jul-20-2026-10_57_24-PM.webp" alt="Custom Mylar Bags">
            <div class="acb-product-overlay">
                <h3 class="acb-product-title">Custom Mylar Bags</h3>
                <a href="http://localhost:10004/get-quote/" class="acb-quote-btn">Get Quote</a>
            </div>
        </div>

        <div class="acb-product-card">
            <img src="http://localhost:10004/wp-content/uploads/2026/07/ChatGPT-Image-Jul-20-2026-05_09_00-PM.webp" alt="Custom Display Boxes">
            <div class="acb-product-overlay">
                <h3 class="acb-product-title">Custom Display Boxes</h3>
                <a href="http://localhost:10004/get-quote/" class="acb-quote-btn">Get Quote</a>
            </div>

        <div class="acb-product-card">
            <img src="http://localhost:10004/wp-content/uploads/2026/07/ChatGPT-Image-Jul-15-2026-08_56_09-PM.webp" alt="Custom Kraft Boxes">
            <div class="acb-product-overlay">
                <h3 class="acb-product-title">Custom Kraft Boxes</h3>
                <a href="http://localhost:10004/get-quote/" class="acb-quote-btn">Get Quote</a>

        <div class="acb-product-card">
            <img src="http://localhost:10004/wp-content/uploads/2026/07/ChatGPT-Image-Jul-15-2026-04_59_18-PM.webp" alt="Christmas Boxes">
            <div class="acb-product-overlay">

    </div>
</div>

<script>
if (!window.acbQuoteBtnInit) {
    window.acbQuoteBtnInit = true;
    document.addEventListener('click', function (e) {
        var btn = e.target.closest('.acb-quote-btn');
        if (btn) {
            var target = document.getElementById('quote-form');
            if (target) {
                e.preventDefault();
                target.scrollIntoView({ behavior: 'smooth' });
            }
        }
    });
}
</script>
